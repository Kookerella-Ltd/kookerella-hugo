{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
<ul class="product-list">
  {{ range .Pages }}
  <li class="product-card">
    <div class="product-card-header">
      <a class="product-name" href="{{ .RelPermalink }}">{{ .Title }}</a>
      {{ with .Params.version }}<span class="tag">v{{ . }}</span>{{ end }}
    </div>
    <p>{{ .Params.summary }}</p>
    <div class="product-links">
      {{ with .Params.nuget }}<a href="{{ . }}">NuGet &rarr;</a>{{ end }}
      {{ with .Params.github }}<a href="{{ . }}">GitHub &rarr;</a>{{ end }}
    </div>
  </li>
  {{ end }}
</ul>
{{ end }}
