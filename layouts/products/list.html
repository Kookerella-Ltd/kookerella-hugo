{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
<ul class="product-list">
  {{ range .Site.Data.packages }}
  <li class="product-card">
    <div class="product-card-header">
      <span class="product-name">{{ .name }}</span>
      {{ with .version }}<span class="tag">v{{ . }}</span>{{ end }}
    </div>
    <p>{{ .description }}</p>
    <div class="product-links">
      {{ with .nuget }}<a href="{{ . }}">NuGet &rarr;</a>{{ end }}
      {{ with .github }}<a href="{{ . }}">GitHub &rarr;</a>{{ end }}
    </div>
  </li>
  {{ end }}
</ul>
{{ end }}
