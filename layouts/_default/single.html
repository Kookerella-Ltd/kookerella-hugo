{{ define "main" }}
<article class="post">
  <h1>{{ .Title }}</h1>
  <p class="post-meta">
    {{ .Date.Format "2 January 2006" }}
    {{ if .Params.tags }} · {{ range .Params.tags }}<span class="tag">{{ . }}</span>{{ end }}{{ end }}
  </p>
  <div class="post-content">
    {{ .Content }}
  </div>
</article>
{{ end }}
